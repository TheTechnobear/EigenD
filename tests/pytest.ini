# pytest configuration for EigenD testing

[pytest]
minversion = 6.0
testpaths = unit integration
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --disable-warnings
    --color=yes
    --timeout=10
    --timeout-method=thread

# Test markers for categorization  
markers =
    foundation: Core dependency and import tests
    core: Core library functionality (pi, piw, pisession)
    data: Data layer and serialization tests  
    plugins: Plugin system tests
    applications: Application layer tests
    integration: Cross-component integration tests
    slow: Long-running tests (>10s)
    cpp: C++ integration tests
    migration: Python 3.14 migration specific issues

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage settings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning