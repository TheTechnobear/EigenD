name: Label issues from form

on:
  issues:
    types: [opened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Fetch and parse YAML metadata files from GitHub API
            async function getYamlList(path) {
              try {
                const response = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: path,
                  ref: context.ref
                });
                const content = Buffer.from(response.data.content, 'base64').toString('utf8');
                // Simple YAML list parser - extracts lines starting with "- "
                const matches = content.match(/^- (.+)$/gm);
                return matches ? matches.map(m => m.substring(2).trim()) : [];
              } catch (e) {
                console.log(`Warning: Could not load ${path}: ${e.message}`);
                return [];
              }
            }
            
            // Load valid values from metadata files
            const validVersions = await getYamlList('.github/issue-metadata/versions.yml');
            const validPlatforms = await getYamlList('.github/issue-metadata/platforms.yml');
            const validComponents = await getYamlList('.github/issue-metadata/components.yml');
            const validAgents = await getYamlList('.github/issue-metadata/agents.yml');
            const validHardware = await getYamlList('.github/issue-metadata/hardware.yml');
            const validSeverities = await getYamlList('.github/issue-metadata/severities.yml');
            
            const issue_number = context.payload.issue.number;
            const body = context.payload.issue.body || '';
            const labels = [];

            function extract(field) {
              // Try inline pattern first: "Field: value" (same line)
              const inlineRe = new RegExp('^' + field + '[:\\s]*([^\\n\\r]+)', 'im');
              let m = body.match(inlineRe);
              if (m && m[1] && m[1].trim()) return m[1].trim();

              // Fallback: markdown heading-style fields (e.g. "### Agent" on its own line
              // with the selected value on the next line). Capture the next non-empty line.
              const headingRe = new RegExp('^#{1,6}\\s*' + field + '\\s*$[\\r\\n]+([^\\r\\n]+)', 'im');
              m = body.match(headingRe);
              if (m && m[1] && m[1].trim()) return m[1].trim();

              // Another fallback: plain line with field name then newline then value
              const nextLineRe = new RegExp('^' + field + '\\s*$[\\r\\n]+([^\\r\\n]+)', 'im');
              m = body.match(nextLineRe);
              if (m && m[1] && m[1].trim()) return m[1].trim();

              return null;
            }

            const version = extract('Version');
            if (version && validVersions.includes(version)) {
              labels.push(`version: ${version}`);
            }

            const platform = extract('Platform');
            if (platform && validPlatforms.includes(platform)) {
              labels.push(`platform: ${platform}`);
            }

            const component = extract('Component');
            if (component && validComponents.includes(component)) {
              labels.push(`component: ${component}`);
            }

            const agent = extract('Agent');
            if (agent) {
              // Normalize extracted value: remove backticks, trim surrounding whitespace,
              // drop any parenthesised helper text (e.g. "Pico Manager (pico_manager)")
              const normalized = agent.replace(/`/g, '').split('(')[0].trim();
              // Match case-insensitively against known agents and use the canonical entry if found
              const matched = validAgents.find(v => v.toLowerCase() === normalized.toLowerCase());
              console.log(`DEBUG: raw agent='${agent}', normalized='${normalized}', matched='${matched || ''}'`);
              if (matched) {
                labels.push(`agent: ${matched}`);
              }
            }

            const hardware = extract('Hardware');
            if (hardware && validHardware.includes(hardware)) {
              labels.push(`hardware: ${hardware}`);
            }

            const severity = extract('Severity');
            if (severity && validSeverities.includes(severity)) {
              labels.push(`severity: ${severity}`);
            }

            if (context.payload.action === 'opened') labels.push('status: open');

            // Get current labels
            const currentLabels = context.payload.issue.labels.map(l => l.name);
            
            // Find typed labels (version:, platform:, etc.) currently on the issue
            const currentTypedLabels = currentLabels.filter(label => {
              return label.startsWith('version: ') ||
                     label.startsWith('platform: ') ||
                     label.startsWith('component: ') ||
                     label.startsWith('agent: ') ||
                     label.startsWith('hardware: ') ||
                     label.startsWith('severity: ');
            });
            
            console.log(`DEBUG: computed labels to add-candidates: ${JSON.stringify(labels)}`);

            // Find labels to remove (current typed labels not in new labels list)
            const labelsToRemove = currentTypedLabels.filter(label => !labels.includes(label));
            
            // Find labels to add (new labels not in current labels list)
            const labelsToAdd = labels.filter(label => !currentLabels.includes(label));
            
            // Remove outdated labels
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name: label
                });
                console.log(`Removed label: ${label}`);
              } catch (e) {
                console.log(`Could not remove label ${label}: ${e.message}`);
              }
            }

            // Add new labels
            if (labelsToAdd.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                labels: labelsToAdd
              });
              console.log(`Added labels: ${labelsToAdd.join(', ')}`);
            }
            
            if (labelsToRemove.length === 0 && labelsToAdd.length === 0) {
              console.log('No label changes needed');
            }
