name: Label issues from form

on:
  issues:
    types: [opened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/issue-metadata
          sparse-checkout-cone-mode: false
      
      - uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const yaml = require('js-yaml');
            
            // Load valid values from metadata files
            const validVersions = yaml.load(fs.readFileSync('.github/issue-metadata/versions.yml', 'utf8')).versions;
            const validPlatforms = yaml.load(fs.readFileSync('.github/issue-metadata/platforms.yml', 'utf8')).platforms;
            const validComponents = yaml.load(fs.readFileSync('.github/issue-metadata/components.yml', 'utf8')).components;
            const validAgents = yaml.load(fs.readFileSync('.github/issue-metadata/agents.yml', 'utf8')).agents;
            const validHardware = yaml.load(fs.readFileSync('.github/issue-metadata/hardware.yml', 'utf8')).hardware;
            const validSeverities = yaml.load(fs.readFileSync('.github/issue-metadata/severities.yml', 'utf8')).severities;
            
            const issue_number = context.payload.issue.number;
            const body = context.payload.issue.body || '';
            const labels = [];

            function extract(field) {
              const re = new RegExp(field + '[:\\s]*([^\\n\\r]+)', 'i');
              const m = body.match(re);
              return m ? m[1].trim() : null;
            }

            const version = extract('Version');
            if (version && validVersions.includes(version)) {
              labels.push(`version: ${version}`);
            }

            const platform = extract('Platform');
            if (platform && validPlatforms.includes(platform)) {
              labels.push(`platform: ${platform}`);
            }

            const component = extract('Component');
            if (component && validComponents.includes(component)) {
              labels.push(`component: ${component}`);
            }

            const agent = extract('Agent');
            if (agent && validAgents.includes(agent)) {
              labels.push(`agent: ${agent}`);
            }

            const hardware = extract('Hardware');
            if (hardware && validHardware.includes(hardware)) {
              labels.push(`hardware: ${hardware}`);
            }

            const severity = extract('Severity');
            if (severity && validSeverities.includes(severity)) {
              labels.push(`severity: ${severity}`);
            }

            if (context.payload.action === 'opened') labels.push('status: open');

            // Get current labels
            const currentLabels = context.payload.issue.labels.map(l => l.name);
            
            // Remove old labels of each type
            const labelsToRemove = currentLabels.filter(label => {
              return label.startsWith('version: ') ||
                     label.startsWith('platform: ') ||
                     label.startsWith('component: ') ||
                     label.startsWith('agent: ') ||
                     label.startsWith('hardware: ') ||
                     label.startsWith('severity: ');
            });
            
            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name: label
                });
              } catch (e) {
                // Label might not exist, ignore
              }
            }

            // Add new labels
            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                labels
              });
            }
